<!-- temperature converter create a web page that
 takes temperature in Celsius and converts it to Fahrenheit using --javascript display the result dynamically-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Temperature Converter</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                justify-content: center;
                align-items: center;
            }
            #result{
                font-weight: bold;
                margin-top: 10px;
                color:blue;
                font-size: 20px;
            }
            .button{
                background-color:green;
                color:white;
                border:none;
                padding:10px 20px;
                border-radius:5px;         
                cursor:pointer;
            }

            h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
            label {
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
            color: black;
        }
        </style>
    </head>
    <body>
        <h1>Temperature Converter</h1>
        <label for="celsius">Enter temperature in Celsius:</label>
        <input type="number" id="celsius" name="celsius">
        <button onclick="convertToFahrenheit()" class="button">Convert to Fahrenheit</button>
        <p id="result"></p>

        <script>
            function convertToFahrenheit() {
                const celsius = document.getElementById('celsius').value;
                const fahrenheit = (celsius * 9/5) + 32;
                document.getElementById('result').innerText = `${celsius}°C is equal to ${fahrenheit}°F`;
            }
        </script>
        </body>
</html>
